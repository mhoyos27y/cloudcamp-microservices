on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-micro:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install-java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version

      - name: gradle-test
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: build-gradle
        run: |
          ./gradlew bootJar
          ls build/libs
          terraform plan

      - name: deploy-jar
        if: ${{ github.event_name == 'push' }}
        run: echo 'Deploy jar.....'
        

